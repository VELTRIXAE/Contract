name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build WASM and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust (wasm32v1-none)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32v1-none
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Test deployment safety guards (offline)
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Scan tracked files for credentials
        run: python3 scripts/check-secrets.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Integration tests load the compiled WASM, so build first.
      - name: Build contracts
        run: cargo build --target wasm32v1-none --release --locked

      - name: Run tests
        run: cargo test --locked

      - name: Stress quote rounding and compatibility properties
        env:
          PROPTEST_CASES: "100000"
        run: cargo test --locked -p veltrixae-library --test amm_properties

      - name: Clippy (correctness lints)
        run: cargo clippy --all-targets --locked -- -A clippy::all -D clippy::correctness

      - name: Report WASM sizes and hashes
        run: |
          ls -l target/wasm32v1-none/release/veltrixae_*.wasm
          sha256sum target/wasm32v1-none/release/veltrixae_*.wasm

      - name: Verify generated clients and metadata against artifacts
        run: |
          make bindings metadata
          git diff --exit-code -- bindings/ metadata/

      - name: Verify deterministic clean rebuild
        run: |
          sha256sum target/wasm32v1-none/release/veltrixae_*.wasm > /tmp/wasm-before.sha256
          cargo build --locked --target wasm32v1-none --release --target-dir "$RUNNER_TEMP/veltrixae-repro"
          for artifact in target/wasm32v1-none/release/veltrixae_*.wasm; do
            cmp "$artifact" "$RUNNER_TEMP/veltrixae-repro/wasm32v1-none/release/$(basename "$artifact")"
          done
          sha256sum --check /tmp/wasm-before.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: veltrixae-wasm
          path: target/wasm32v1-none/release/veltrixae_*.wasm
          if-no-files-found: error

  bindings:
    name: Build TypeScript bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract: [factory, pair, router]
    defaults:
      run:
        working-directory: bindings/${{ matrix.contract }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bindings/${{ matrix.contract }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm audit --audit-level=high

  dependencies:
    name: Rust dependency advisories (both lockfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit contract workspace
        run: cargo audit --file Cargo.lock
      - name: Audit generator workspace even if contract audit failed
        if: ${{ !cancelled() }}
        run: cargo audit --file tools/spec-tool/Cargo.lock
