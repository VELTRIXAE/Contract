[package]
name = "veltrixae-spec-tool"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Offline generator for VELTRIXAE contract bindings and interface metadata"

# Kept out of the contract workspace: soroban-spec-typescript pins its own
# soroban-spec / stellar-xdr versions, which differ from the contracts' SDK.
[workspace]

[dependencies]
soroban-spec = "28"
soroban-spec-typescript = "=28.1.0"
stellar-xdr = { version = "28", default-features = false, features = ["std", "serde"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
debug = 0
