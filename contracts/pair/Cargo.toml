[package]
name = "veltrixae-pair"
version = "0.0.1"
authors = ["VELTRIXAE", "esteblock <esteblock@paltalabs.io> (Soroswap upstream)"]
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
