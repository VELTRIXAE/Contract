[package]
name = "veltrixae-router"
version = "0.0.1"
description = "VELTRIXAE Router: user-facing entry point for swaps (single and multi-hop) and liquidity management"
authors = ["VELTRIXAE", "esteblock <esteblock@paltalabs.io> (Soroswap upstream)"]
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
num-integer = { workspace = true }
veltrixae-library = { path = "../library" }
veltrixae-factory-interface = { path = "../factory-interface" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
