[package]
name = "soroswap-router"
version = "0.0.1"
description = "Swap of tokens when a direct pair does not exist, by using a given paths. It will also handle liquidity provision and manage deposit and withdrawal functions for liquidity providers."
authors = ["esteblock <esteblock@paltalabs.io>"]
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
num-integer = { workspace = true }
soroswap-library = { path = "../library" }
soroswap-factory-interface = { path = "../factory-interface" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
