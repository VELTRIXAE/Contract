[package]
name = "soroswap-library"
version = "2.0.0"
description = "Library that enables efficient and optimized code execution across different contracts on the Soroswap.Finance protocol"
authors = ["esteblock <esteblock@paltalabs.io>"]
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib"]
doctest = false

[features]
# Export the stand-alone library contract. Off by default so the library can be
# linked into other contracts without leaking its functions into their WASM.
contract = []

[dependencies]
soroban-sdk = { workspace = true }
num-integer = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
