[package]
name = "veltrixae-library"
version = "2.0.0"
description = "VELTRIXAE AMM library: pair address derivation, reserve lookup and constant-product quote math (derived from soroswap-library)"
authors = ["VELTRIXAE", "esteblock <esteblock@paltalabs.io> (Soroswap upstream)"]
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib"]
doctest = false

[features]
# Export the stand-alone library contract. Off by default so the library can be
# linked into other contracts without leaking its functions into their WASM.
contract = []

[dependencies]
soroban-sdk = { workspace = true }
num-integer = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.11.0"
